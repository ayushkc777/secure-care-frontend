name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage and accessibility evidence
        run: |
          npm run test:coverage
          npm run test:a11y

      - name: Build
        run: npm run verify:build

      - name: Audit dependencies and fail on Critical findings
        run: npm audit --audit-level=critical

      - name: Build production image
        run: docker build --target production -t securecare-frontend:ci .

      - name: Generate CycloneDX dependency SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@4 --output-file sbom.cdx.json

      - uses: actions/upload-artifact@v6
        with:
          name: frontend-evidence
          path: |
            coverage/
            sbom.cdx.json
